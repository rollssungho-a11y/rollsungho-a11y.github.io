<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>협업 문의 — TDC COLLECTIVE</title><meta name="description" content="TDC COLLECTIVE 브랜드 및 상품 협업 문의"><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="professional.css"></head><body><header class="nav"><div class="wrap navin"><a class="brand" href="index.html"><img src="tdc-logo.png" alt="TDC COLLECTIVE"></a><button class="menu" aria-label="메뉴">☰</button><nav class="links"><a href="index.html">HOME</a><a href="about.html">ABOUT</a><a href="business.html">BUSINESS</a><a href="partners.html">WHY TDC</a><a class="cta" aria-current="page" href="proposal.html">협업 문의</a></nav></div></header><main><section class="pagehead pagehead-pro"><div class="wrap"><div class="eyebrow">PARTNERSHIP INQUIRY</div><h1>상품 정보를 보내주시면<br>협업 가능성을 검토하겠습니다.</h1><p class="lead">제품 소개서나 판매 페이지가 있다면 함께 보내주세요. 확인 후 담당자가 회신드립니다.</p><div class="inquiry-email"><span>자료 직접 발송</span><a href="mailto:tdc010@naver.com">tdc010@naver.com</a></div></div></section><section class="section white"><div class="wrap"><form class="form pro-form" id="proposalForm" action="https://formspree.io/f/xgavknyp" method="POST"><div class="fieldrow"><div class="field"><label for="company">회사·브랜드명</label><input id="company" name="회사·브랜드명" placeholder="회사 또는 브랜드명" required></div><div class="field"><label for="name">담당자명</label><input id="name" name="담당자명" placeholder="성함" required></div></div><div class="fieldrow"><div class="field"><label for="contact">회신받을 이메일</label><input type="email" id="contact" name="회신 이메일" placeholder="name@company.com" required></div><div class="field"><label for="website">제품·홈페이지 링크 <span class="optional">선택</span></label><input type="url" id="website" name="제품 또는 홈페이지 링크" placeholder="https://"></div></div><div class="field"><label for="message">상품 및 제안 내용</label><textarea id="message" name="제안 내용" placeholder="상품의 특징, 현재 판매 방식과 요청 사항을 간단히 알려주세요." required></textarea></div><input type="text" name="_gotcha" style="display:none" tabindex="-1" autocomplete="off"><p class="notice">입력하신 정보는 제안 검토와 회신 목적으로만 사용됩니다.</p><div class="actions"><button class="btn primary" type="submit" id="submitButton">검토 요청 보내기</button></div><p id="formStatus" role="status" style="font-weight:800;margin-top:18px"></p></form></div></section></main><footer></footer><script src="script.js"></script><script>const form=document.getElementById('proposalForm'),button=document.getElementById('submitButton'),status=document.getElementById('formStatus');form.addEventListener('submit',async(e)=>{e.preventDefault();button.disabled=true;button.textContent='전송 중...';status.textContent='';try{const response=await fetch(form.action,{method:'POST',body:new FormData(form),headers:{Accept:'application/json'}});if(response.ok){form.reset();status.textContent='접수되었습니다. 확인 후 회신드리겠습니다.'}else throw new Error()}catch(error){status.textContent='전송에 실패했습니다. tdc010@naver.com으로 보내주세요.'}finally{button.disabled=false;button.textContent='검토 요청 보내기'}});</script></body></html>
