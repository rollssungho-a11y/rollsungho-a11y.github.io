<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>제안 요청 — TDC COLLECTIVE</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="styles.css"></head><body><header class="nav"><div class="wrap navin"><a class="brand" href="index.html"><img src="tdc-logo.png" alt="TDC collective"></a><button class="menu">☰</button><nav class="links"><a href="index.html">HOME</a><a href="about.html">ABOUT</a><a href="business.html">BUSINESS</a><a href="partners.html">PARTNERS & PRODUCTS</a><a class="cta" aria-current="page" href="proposal.html">제안 요청</a></nav></div></header><main><section class="pagehead"><div class="wrap"><div class="eyebrow">Proposal request</div><h1>함께 만들고 싶은<br>판매를 알려주세요.</h1><p class="lead">브랜드 제휴, 제품 유통, 크리에이터 협업 중 필요한 내용을 남겨주시면 검토에 필요한 정보를 정리해드립니다.</p></div></section><section class="section"><div class="wrap"><form class="form"><div class="fieldrow"><div class="field"><label for="type">문의 유형</label><select id="type"><option>브랜드·제조사 제휴</option><option>크리에이터 협업</option><option>제품 유통 제안</option><option>기타 문의</option></select></div><div class="field"><label for="company">회사·채널명</label><input id="company" placeholder="브랜드명 또는 채널명"></div></div><div class="fieldrow"><div class="field"><label for="name">담당자명</label><input id="name" placeholder="성함"></div><div class="field"><label for="contact">연락처 또는 이메일</label><input id="contact" placeholder="회신받을 연락처"></div></div><div class="field"><label for="message">제안 내용</label><textarea id="message" placeholder="제품, 목표 고객, 희망 일정과 요청 사항을 알려주세요."></textarea></div><p class="notice">현재 온라인 접수 시스템을 준비 중입니다. 아래 버튼을 누르면 작성 내용이 복사됩니다.</p><button class="btn primary" type="button" id="copy">제안 내용 복사하기</button><span id="done" style="margin-left:12px;font-weight:800"></span></form></div></section></main><footer><div class="wrap foot"><strong>TDC COLLECTIVE</strong><p>© 2026 TDC COLLECTIVE.</p></div></footer><script src="script.js"></script><script>copy.onclick=async()=>{const t=`[TDC 제안 요청]\n문의유형: ${type.value}\n회사·채널: ${company.value}\n담당자: ${name.value}\n연락처: ${contact.value}\n제안내용: ${message.value}`;await navigator.clipboard.writeText(t);done.textContent='복사되었습니다.'}</script></body></html>
