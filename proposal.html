<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>제안 요청 — TDC COLLECTIVE</title>
  <link rel="icon" href="favicon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="nav"><div class="wrap navin"><a class="brand" href="index.html"><img src="tdc-logo.png" alt="TDC collective"></a><button class="menu" aria-label="메뉴">☰</button><nav class="links"><a href="index.html">HOME</a><a href="about.html">ABOUT</a><a href="business.html">BUSINESS</a><a href="partners.html">PARTNERS & PRODUCTS</a><a class="cta" aria-current="page" href="proposal.html">제안 요청</a></nav></div></header>
  <main>
    <section class="pagehead"><div class="wrap"><div class="eyebrow">Proposal request</div><h1>함께 만들고 싶은<br>판매를 알려주세요.</h1><p class="lead">아래 내용을 작성한 뒤 이메일 또는 문자 중 편한 방법으로 보내주세요.</p></div></section>
    <section class="section"><div class="wrap">
      <form class="form" id="proposalForm" action="https://formspree.io/f/xgavknyp" method="POST">
        <div class="fieldrow">
          <div class="field"><label for="type">문의 유형</label><select id="type" name="문의 유형" required><option>브랜드·제조사 제휴</option><option>크리에이터 협업</option><option>제품 유통 제안</option><option>기타 문의</option></select></div>
          <div class="field"><label for="company">회사·채널명</label><input id="company" name="회사·채널명" placeholder="브랜드명 또는 채널명" required></div>
        </div>
        <div class="fieldrow">
          <div class="field"><label for="name">담당자명</label><input id="name" name="담당자명" placeholder="성함" required></div>
          <div class="field"><label for="contact">회신받을 연락처</label><input id="contact" name="회신 연락처" placeholder="전화번호 또는 이메일" required></div>
        </div>
        <div class="field"><label for="message">제안 내용</label><textarea id="message" name="제안 내용" placeholder="제품, 목표 고객, 희망 일정과 요청 사항을 알려주세요." required></textarea></div>
        <input type="text" name="_gotcha" style="display:none" tabindex="-1" autocomplete="off">
        <p class="notice">입력하신 정보는 제안 검토와 회신 목적으로만 사용됩니다.</p>
        <div class="actions"><button class="btn primary" type="submit" id="submitButton">제안 요청하기</button></div>
        <p id="formStatus" role="status" style="font-weight:800;margin-top:18px"></p>
      </form>
    </div></section>
  </main>
  <footer></footer>
  <script src="script.js"></script>
  <script>
    const form=document.getElementById('proposalForm');
    const status=document.getElementById('formStatus');
    const submitButton=document.getElementById('submitButton');
    form.addEventListener('submit',async event=>{
      event.preventDefault();
      submitButton.disabled=true;
      submitButton.textContent='접수 중...';
      status.textContent='';
      try{
        const response=await fetch(form.action,{method:'POST',body:new FormData(form),headers:{Accept:'application/json'}});
        if(!response.ok)throw new Error('submit failed');
        form.reset();
        status.textContent='제안이 정상적으로 접수되었습니다. 확인 후 연락드리겠습니다.';
        status.style.color='#16713d';
      }catch(error){
        status.textContent='접수에 실패했습니다. 잠시 후 다시 시도하거나 tmsk0823@naver.com으로 보내주세요.';
        status.style.color='#a51f1a';
      }finally{
        submitButton.disabled=false;
        submitButton.textContent='제안 요청하기';
      }
    });
  </script>
</body>
</html>
